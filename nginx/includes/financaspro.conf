# Proxy reverso para o container app. RESERVADO — nao esta em uso.
#
# Para usar: publique este arquivo em conf.d/ de um nginx que enxergue o
# container, ajuste server_name e os caminhos dos certificados em ../certs/.

upstream financaspro {
    server 127.0.0.1:9000;
}

server {
    listen 443 ssl http2;
    server_name financas.exemplo.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 10 MB: o mesmo limite por arquivo do modulo de upload. Menor que isso
    # e o nginx recusa antes de a API poder dar a mensagem de erro certa.
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Assets com hash no nome podem ser cacheados para sempre.
    location /assets/ {
        proxy_pass http://financaspro;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://financaspro;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name financas.exemplo.com;
    return 301 https://$host$request_uri;
}
